# Deploy do site VOCIRE na Netlify.
# Os cabeçalhos ficam em public/_headers.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# `trailingSlash: 'never'` + `format: 'file'` no Astro: /contato serve
# contato.html direto, sem redirecionamento intermediário.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
